<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Dashboard — Healthy Catering Services Portal</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#183D32">
<link rel="icon" type="image/webp" href="images/logo-forest.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>

:root{
  --forest:#183D32; --emerald:#27845C; --sage:#A9C5A4; --ivory:#FAF7EF; --cream:#F0E8D8; --coral:#E87555; --citrus:#EBCB72;
  --charcoal:#262C28; --muted:#777E77; --white:#FFFFFF;
  --line:rgba(24,61,50,.14); --radius:4px; --radius-lg:8px;
  --serif:'DM Serif Display','Playfair Display',Georgia,serif; --sans:'Manrope','DM Sans',system-ui,-apple-system,Segoe UI,sans-serif;
  --shadow:0 18px 40px -22px rgba(24,61,50,.45); --ease:cubic-bezier(.22,.7,.2,1);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;overflow-x:hidden;-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--sans);color:var(--charcoal);background:var(--ivory);line-height:1.65;overflow-x:hidden;font-size:16px}
img{max-width:100%;height:auto;display:block}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4{font-family:var(--serif);font-weight:400;line-height:1.12;margin:0 0 .5em;color:var(--forest);letter-spacing:-.01em}
h1{font-size:clamp(2.5rem,5.6vw,4.6rem)} h2{font-size:clamp(2rem,3.8vw,3.1rem)} h3{font-size:clamp(1.25rem,1.8vw,1.6rem)}
p{margin:0 0 1em} ul{margin:0;padding:0;list-style:none}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--coral);outline-offset:3px;border-radius:2px}
.skip{position:absolute;left:-999px;top:8px;background:var(--forest);color:var(--ivory);padding:10px 16px;z-index:300;border-radius:var(--radius)}
.skip:focus{left:8px}
.wrap{width:min(1240px,100% - 48px);margin-inline:auto}
.section{padding:clamp(64px,9vw,120px) 0;position:relative}
.section.cream{background:var(--cream)} .section.dark{background:var(--forest);color:var(--ivory)}
.section.dark h2,.section.dark h3{color:var(--ivory)}
.label{display:inline-flex;align-items:center;gap:12px;font-weight:700;font-size:.95rem;color:var(--emerald);margin-bottom:18px}
.label::before{content:"";width:34px;height:2px;background:var(--coral)}
.dark .label{color:var(--citrus)}
.lead{font-size:clamp(1.05rem,1.4vw,1.2rem);color:#4b534d;max-width:62ch}
.dark .lead{color:rgba(250,247,239,.82)}
.sec-head{max-width:720px;margin-bottom:clamp(36px,5vw,64px)}
/* buttons */
.btn{--bg:var(--emerald);--fg:#fff;--bd:var(--emerald);position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:14px 26px;min-height:48px;font-weight:700;font-size:.95rem;border:1.5px solid var(--bd);background:var(--bg);color:var(--fg);border-radius:var(--radius);overflow:hidden;isolation:isolate;transition:color .35s var(--ease),border-color .35s var(--ease),transform .35s var(--ease),box-shadow .35s var(--ease);white-space:nowrap}
.btn::before{content:"";position:absolute;inset:0;background:var(--forest);transform:scaleX(0);transform-origin:left;transition:transform .45s var(--ease);z-index:-1}
.btn:hover::before,.btn:focus-visible::before{transform:scaleX(1)} .btn:hover,.btn:focus-visible{border-color:var(--forest);transform:translateY(-2px);box-shadow:0 14px 24px -14px rgba(24,61,50,.6)}
.btn i{transition:transform .35s var(--ease)} .btn:hover i.fa-arrow-right,.btn:focus-visible i.fa-arrow-right{transform:translateX(4px)}
.btn.ghost{--bg:transparent;--fg:var(--forest);--bd:var(--forest)} .btn.ghost::before{background:var(--forest)} .btn.ghost:hover,.btn.ghost:focus-visible{color:var(--ivory)}
.btn.light{--bg:var(--ivory);--fg:var(--forest);--bd:var(--ivory)} .btn.light::before{background:var(--citrus)} .btn.light:hover,.btn.light:focus-visible{color:var(--forest);border-color:var(--citrus)}
.btn.line-light{--bg:transparent;--fg:var(--ivory);--bd:rgba(250,247,239,.6)} .btn.line-light::before{background:var(--ivory)} .btn.line-light:hover,.btn.line-light:focus-visible{color:var(--forest);border-color:var(--ivory)}
.btn.coral{--bg:var(--coral);--bd:var(--coral)} .btn.coral::before{background:var(--forest)}
.btn.sm{padding:10px 18px;min-height:42px;font-size:.88rem}
.btn[disabled]{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none}
.btn-row{display:flex;flex-wrap:wrap;gap:14px}
.link-arrow{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--emerald);border-bottom:2px solid transparent;transition:gap .3s var(--ease),border-color .3s,color .3s}
.link-arrow:hover,.link-arrow:focus-visible{gap:14px;border-color:var(--coral);color:var(--forest)}
/* header */
.site-header{position:fixed;inset:0 0 auto 0;z-index:100;transition:background .4s var(--ease),box-shadow .4s var(--ease),backdrop-filter .4s,border-color .4s;border-bottom:1px solid transparent;background:linear-gradient(180deg,rgba(250,247,239,.78),rgba(250,247,239,0))}
.site-header.scrolled{background:rgba(250,247,239,.86);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);border-color:var(--line);box-shadow:0 10px 30px -22px rgba(24,61,50,.6)}
.bar{width:min(1280px,100% - 40px);margin-inline:auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 0;gap:20px}
.brand{display:flex;align-items:center;gap:12px;justify-self:start}
.logo-img{height:auto;width:clamp(128px,11vw,158px)}
.nav{display:flex;gap:6px}
.nav a{position:relative;padding:10px 16px;font-weight:600;font-size:.95rem;color:var(--forest);transition:color .3s}
.nav a::after{content:"";position:absolute;left:16px;right:16px;bottom:4px;height:2px;background:var(--coral);transform:scaleX(0);transform-origin:left;transition:transform .4s var(--ease)}
.nav a:hover::after,.nav a:focus-visible::after,.nav a.active::after{transform:scaleX(1)} .nav a.active{color:var(--emerald)}
.bar .login{justify-self:end}
.login-btn{--bg:var(--forest);--bd:var(--forest);padding:11px 24px}
.login-btn::before{background:var(--coral)} .login-btn:hover,.login-btn:focus-visible{border-color:var(--coral)}
.burger{display:none;justify-self:end;width:48px;height:48px;border:1.5px solid var(--forest);background:transparent;color:var(--forest);border-radius:var(--radius);font-size:1.15rem;align-items:center;justify-content:center;transition:background .3s,color .3s}
.burger:hover{background:var(--forest);color:var(--ivory)}
.scrim{position:fixed;inset:0;background:rgba(24,61,50,.55);backdrop-filter:blur(2px);opacity:0;visibility:hidden;transition:opacity .4s,visibility .4s;z-index:140}
.scrim.open{opacity:1;visibility:visible}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(88vw,370px);background:var(--forest);color:var(--ivory);z-index:150;transform:translateX(102%);transition:transform .5s var(--ease);display:flex;flex-direction:column;padding:22px 24px 28px;overflow-y:auto;visibility:hidden}
.drawer.open{transform:none;visibility:visible}
.drawer-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px}
.drawer .logo-img{width:140px}
.drawer-close{width:46px;height:46px;border-radius:var(--radius);border:1.5px solid rgba(250,247,239,.5);background:transparent;color:var(--ivory);font-size:1.2rem;transition:background .3s,color .3s,transform .4s var(--ease)}
.drawer-close:hover{background:var(--ivory);color:var(--forest);transform:rotate(90deg)}
.drawer nav{display:flex;flex-direction:column}
.drawer nav a{padding:16px 4px;font-family:var(--serif);font-size:1.6rem;border-bottom:1px solid rgba(250,247,239,.14);transition:padding-left .35s var(--ease),color .3s}
.drawer nav a:hover,.drawer nav a.active{padding-left:14px;color:var(--citrus)}
.drawer .btn{margin-top:28px;width:100%}
body.no-scroll{overflow:hidden}
@media (max-width:980px){.nav,.bar .login{display:none}.burger{display:inline-flex}.bar{grid-template-columns:1fr auto}}
/* footer */
.site-footer{background:var(--forest);color:rgba(250,247,239,.84);position:relative;overflow:hidden;padding:clamp(56px,7vw,88px) 0 0}
.site-footer::before{content:"";position:absolute;right:-120px;top:-120px;width:360px;height:360px;border:1px solid rgba(250,247,239,.1);border-radius:50%;pointer-events:none}
.site-footer::after{content:"";position:absolute;left:-60px;bottom:40px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(235,203,114,.18),transparent 70%);pointer-events:none}
.foot-grid{display:grid;grid-template-columns:1.4fr .9fr 1.1fr 1.3fr;gap:clamp(28px,4vw,56px);position:relative;z-index:1}
.site-footer h3{font-family:var(--sans);font-weight:700;font-size:1rem;color:var(--ivory);margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid rgba(250,247,239,.16)}
.foot-brand .logo-img{width:170px;margin-bottom:18px} .foot-brand p{font-size:.95rem;max-width:34ch}
.socials{display:flex;gap:10px;margin-top:20px}
.socials a{width:44px;height:44px;display:grid;place-items:center;border:1px solid rgba(250,247,239,.3);border-radius:var(--radius);color:var(--ivory);transition:background .3s,color .3s,transform .35s var(--ease),border-color .3s}
.socials a:hover,.socials a:focus-visible{background:var(--citrus);color:var(--forest);border-color:var(--citrus);transform:translateY(-4px)}
.foot-links li{margin-bottom:6px}
.foot-links a{display:inline-block;padding:5px 0;position:relative;transition:color .3s,transform .35s var(--ease)}
.foot-links a::before{content:"";position:absolute;left:0;bottom:2px;width:100%;height:1px;background:var(--citrus);transform:scaleX(0);transform-origin:left;transition:transform .4s var(--ease)}
.foot-links a:hover,.foot-links a:focus-visible{color:var(--citrus);transform:translateX(6px)} .foot-links a:hover::before{transform:scaleX(1)}
.foot-contact li{display:flex;gap:14px;margin-bottom:14px;font-size:.95rem;padding:6px 8px;margin-inline:-8px;border-radius:var(--radius);transition:background .3s}
.foot-contact li:hover{background:rgba(250,247,239,.07)} .foot-contact i{color:var(--citrus);margin-top:5px;width:16px;text-align:center}
.foot-note{font-size:.8rem;opacity:.7;margin-top:6px}
.foot-bottom{margin-top:clamp(36px,5vw,60px);border-top:1px solid rgba(250,247,239,.16);padding:22px 0;font-size:.88rem;display:flex;flex-wrap:wrap;gap:10px 24px;justify-content:space-between;position:relative;z-index:1}
@media (max-width:1020px){.foot-grid{grid-template-columns:1fr 1fr}}
@media (max-width:620px){.foot-grid{grid-template-columns:1fr}}
/* reveal */
.reveal{opacity:0;transform:translateY(22px);transition:opacity .8s var(--ease),transform .8s var(--ease);transition-delay:var(--d,0s)}
.reveal.in{opacity:1;transform:none}
.reveal-img{clip-path:inset(0 0 100% 0);transition:clip-path 1.1s var(--ease)} .reveal-img.in{clip-path:inset(0)}
@keyframes rise{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
.hero-in{animation:rise .9s var(--ease) both;animation-delay:var(--d,0s)}
@keyframes pageIn{from{opacity:0}to{opacity:1}} body{animation:pageIn .6s ease both}
/* media blocks */
.zoom{overflow:hidden;position:relative;background:var(--cream)} .zoom img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--ease)} .zoom:hover img{transform:scale(1.06)}
.glass{background:rgba(250,247,239,.62);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);border:1px solid rgba(255,255,255,.55);box-shadow:0 20px 40px -26px rgba(24,61,50,.6);border-radius:var(--radius-lg)}
.tag{display:inline-block;padding:4px 10px;font-size:.74rem;font-weight:700;border-radius:2px;background:rgba(39,132,92,.12);color:var(--emerald)}
.tag.coral{background:rgba(232,117,85,.14);color:#b7452b} .tag.citrus{background:rgba(235,203,114,.35);color:#7a5d0e}
/* forms */
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:18px;position:relative}
.field>label,.field-label{font-weight:700;font-size:.88rem;color:var(--forest)}
.input{width:100%;padding:14px 16px;min-height:50px;font:inherit;color:var(--charcoal);background:var(--white);border:1.5px solid rgba(24,61,50,.22);border-radius:var(--radius);transition:border-color .3s,box-shadow .3s,transform .3s var(--ease)}
.input:hover{border-color:rgba(24,61,50,.45)} .input:focus{outline:none;border-color:var(--emerald);box-shadow:0 0 0 4px rgba(39,132,92,.16);transform:translateY(-1px)}
textarea.input{min-height:140px;resize:vertical}
.field.invalid .input{border-color:var(--coral);box-shadow:0 0 0 4px rgba(232,117,85,.14)}
.field.valid .input{border-color:var(--emerald)}
.err{font-size:.82rem;color:#b7452b;font-weight:600;min-height:0;max-height:0;overflow:hidden;opacity:0;transition:max-height .3s,opacity .3s}
.field.invalid .err{max-height:60px;opacity:1}
.hint{font-size:.8rem;color:var(--muted)}
/* toast */
.toasts{position:fixed;right:20px;bottom:20px;z-index:400;display:flex;flex-direction:column;gap:10px;width:min(380px,100% - 40px)}
.toast{display:flex;gap:12px;align-items:flex-start;background:var(--forest);color:var(--ivory);padding:14px 16px;border-radius:var(--radius);box-shadow:0 20px 40px -18px rgba(0,0,0,.5);border-left:5px solid var(--citrus);animation:toastIn .5s var(--ease) both;font-size:.93rem}
.toast.error{border-left-color:var(--coral)} .toast.success{border-left-color:#6fd3a0}
.toast i{margin-top:3px} .toast.out{animation:toastOut .35s ease both}
.toast button{margin-left:auto;background:none;border:0;color:inherit;opacity:.7;font-size:1rem;padding:0 2px}
@keyframes toastIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}} @keyframes toastOut{to{opacity:0;transform:translateX(30px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}.reveal,.reveal-img{opacity:1;transform:none;clip-path:none}}


body{background:#F3EFE4;visibility:hidden} body.ready{visibility:visible}
.app{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}
.side{position:fixed;top:0;left:0;bottom:0;width:272px;background:var(--forest);color:var(--ivory);display:flex;flex-direction:column;padding:22px 16px 18px;z-index:120;overflow-y:auto;transition:transform .5s var(--ease)}
.side::after{content:"";position:absolute;right:-60px;top:36%;width:180px;height:180px;border-radius:50%;border:1px solid rgba(250,247,239,.1);pointer-events:none}
.side-top{display:flex;align-items:center;justify-content:space-between;padding:0 8px 20px;border-bottom:1px solid rgba(250,247,239,.14);margin-bottom:16px}
.side-top .logo-img{width:150px} .side-close{display:none;width:44px;height:44px;border-radius:var(--radius);border:1.5px solid rgba(250,247,239,.5);background:none;color:var(--ivory);font-size:1.1rem;transition:background .3s,color .3s,transform .4s var(--ease)} .side-close:hover{background:var(--ivory);color:var(--forest);transform:rotate(90deg)}
.side-label{font-size:.76rem;color:rgba(250,247,239,.55);padding:6px 12px;font-weight:700}
.nav-list{display:grid;gap:3px;flex:1;align-content:start}
.nav-btn{position:relative;display:flex;align-items:center;gap:14px;width:100%;padding:12px 14px;min-height:46px;border:0;background:transparent;color:rgba(250,247,239,.85);font-weight:600;font-size:.94rem;text-align:left;border-radius:var(--radius);transition:background .3s,color .3s,padding-left .35s var(--ease)}
.nav-btn i{width:20px;text-align:center;font-size:1rem;color:var(--sage);transition:color .3s,transform .4s var(--ease)}
.nav-btn::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 3px 3px 0;background:var(--citrus);transform:scaleY(0);transition:transform .35s var(--ease)}
.nav-btn:hover,.nav-btn:focus-visible{background:rgba(250,247,239,.09);color:#fff;padding-left:20px} .nav-btn:hover i{color:var(--citrus);transform:scale(1.15)}
.nav-btn.active{background:rgba(250,247,239,.14);color:#fff} .nav-btn.active::before{transform:scaleY(1)} .nav-btn.active i{color:var(--citrus)}
.nav-btn .badge{margin-left:auto;background:var(--coral);color:#fff;font-size:.7rem;font-weight:800;min-width:22px;height:22px;display:grid;place-items:center;border-radius:11px;padding:0 6px}
.nav-btn.logout{margin-top:6px;border:1px solid rgba(250,247,239,.2)} .nav-btn.logout:hover,.nav-btn.logout:focus-visible{background:var(--coral);border-color:var(--coral);color:#fff;padding-left:14px} .nav-btn.logout:hover i{color:#fff;transform:translateX(4px)}
.side-profile{margin:14px 0 10px;padding:14px;border-radius:var(--radius-lg);background:rgba(250,247,239,.08);border:1px solid rgba(250,247,239,.14);display:flex;gap:12px;align-items:center;min-width:0}
.side-profile>div{min-width:0} .side-profile b{display:block;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .side-profile small{display:block;font-size:.76rem;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{flex:none;width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--coral),#b7452b);color:#fff;font-weight:800;display:grid;place-items:center;font-size:.95rem}
.main{grid-column:2;min-width:0;padding:0 clamp(16px,3vw,36px) 48px}
.top{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:16px;padding:16px 0;margin-bottom:8px;background:linear-gradient(180deg,#F3EFE4 78%,rgba(243,239,228,0))}
.top-title{min-width:0;flex:1} .top-title h1{font-size:clamp(1.5rem,2.6vw,2.1rem);margin:0;line-height:1.15} .top-title p{margin:2px 0 0;color:var(--muted);font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.burger-d,.top-logo{display:none}
.burger-d{width:46px;height:46px;border:1.5px solid var(--forest);background:var(--white);color:var(--forest);border-radius:var(--radius);font-size:1.1rem;align-items:center;justify-content:center}
.icon-btn{position:relative;width:46px;height:46px;border-radius:var(--radius);border:1.5px solid rgba(24,61,50,.2);background:var(--white);color:var(--forest);display:grid;place-items:center;transition:background .3s,color .3s,transform .3s var(--ease)} .icon-btn:hover{background:var(--forest);color:var(--ivory);transform:translateY(-2px)}
.icon-btn .dot{position:absolute;top:6px;right:6px;min-width:18px;height:18px;border-radius:9px;background:var(--coral);color:#fff;font-size:.65rem;font-weight:800;display:grid;place-items:center;padding:0 4px}
.who{display:flex;align-items:center;gap:12px;padding:6px 14px 6px 6px;background:var(--white);border:1.5px solid rgba(24,61,50,.14);border-radius:30px;min-width:0;max-width:340px}
.who>div{min-width:0;line-height:1.25} .who b{display:block;font-size:.88rem;color:var(--forest);white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .who small{display:block;font-size:.72rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .av{width:38px;height:38px;font-size:.82rem}
.logout-top{--bg:transparent;--fg:var(--forest);--bd:rgba(24,61,50,.3);padding:10px 16px;min-height:46px} .logout-top::before{background:var(--coral)} .logout-top:hover,.logout-top:focus-visible{color:#fff;border-color:var(--coral)}
.pop{position:absolute;right:0;top:calc(100% + 8px);width:min(340px,86vw);background:var(--white);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:0 26px 50px -22px rgba(24,61,50,.6);padding:8px;opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .25s,transform .35s var(--ease),visibility .25s;z-index:80}
.pop.open{opacity:1;visibility:visible;transform:none} .pop h4{font-family:var(--sans);font-weight:800;font-size:.9rem;padding:10px 12px 6px;margin:0}
.pop li{display:flex;gap:12px;padding:12px;border-radius:var(--radius);font-size:.88rem;transition:background .3s} .pop li:hover{background:var(--cream)} .pop li i{color:var(--emerald);margin-top:4px} .pop li.unread{background:rgba(235,203,114,.2)} .pop small{display:block;color:var(--muted)}
.bell-wrap{position:relative}
@media (max-width:1199px){.app{grid-template-columns:232px minmax(0,1fr)}.side{width:232px}.who>div{display:none}.who{padding:4px}.nav-btn{font-size:.9rem;padding:11px 12px}}
@media (max-width:1000px){
  .app{grid-template-columns:1fr}.main{grid-column:1}

window.toast=function(msg,type){
  const box=document.getElementById('toasts');if(!box)return;
  const t=document.createElement('div');t.className='toast '+(type||'info');t.setAttribute('role',type==='error'?'alert':'status');
  const ic=type==='error'?'fa-circle-exclamation':type==='success'?'fa-circle-check':'fa-circle-info';
  t.innerHTML='<i class="fa-solid '+ic+'" aria-hidden="true"></i><span></span><button type="button" aria-label="Dismiss notification"><i class="fa-solid fa-xmark"></i></button>';
  t.querySelector('span').textContent=msg;box.appendChild(t);
  const kill=()=>{t.classList.add('out');setTimeout(()=>t.remove(),350);};
  t.querySelector('button').addEventListener('click',kill);setTimeout(kill,5200);
};


/* =====================================================================
   DEMO AUTH LAYER — FRONTEND ONLY.
   localStorage keys:
     hcs_users        JSON array of demo accounts {name,email,role,pw(hash),phone}
     hcs_userRole     'admin' | 'customer'
     hcs_userEmail    full email of the signed-in user
     hcs_userName     display name
     hcs_isLoggedIn   'true' while signed in
     hcs_rememberMe   'true' | 'false'
   Remember Me ON  -> session keys live in localStorage (survive closing the browser).
   Remember Me OFF -> session keys live in sessionStorage (cleared when the tab closes).
   SECURITY: this is NOT real authentication. Anyone can edit browser storage.
   A production site needs server-side authentication and password hashing (e.g. bcrypt/argon2).
   ===================================================================== */
const HCS=(function(){
  const LS=window.localStorage,SS=window.sessionStorage;
  const KEYS=['hcs_userRole','hcs_userEmail','hcs_userName','hcs_isLoggedIn'];
  function safe(fn,fb){try{return fn();}catch(_){return fb;}}
  // Demo-only 53-bit string hash (cyrb53) with a salt — keeps plaintext passwords out of storage. NOT secure.
  function hash(str){let h1=0xdeadbeef,h2=0x41c6ce57;const s='hcs-demo-salt:'+str;for(let i=0,ch;i<s.length;i++){ch=s.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}
    h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
    return (4294967296*(2097151&h2)+(h1>>>0)).toString(36);}
  const EMAIL_RE=/^[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)*\.(?:com|in|org)$/i;
  const NAME_RE=/^[A-Za-z]+(?: [A-Za-z]+)*$/;
  function users(){return safe(()=>JSON.parse(LS.getItem('hcs_users')||'[]'),[]);}
  function saveUsers(u){safe(()=>LS.setItem('hcs_users',JSON.stringify(u)));}
  function seed(){
    const u=users();let changed=false;
    [{name:'Demo Admin',email:'admin@healthycatering.in',role:'admin',pw:hash('Admin@123'),phone:'+91 98765 00001',demo:true},
     {name:'Demo Customer',email:'customer@healthycatering.in',role:'customer',pw:hash('Customer@123'),phone:'+91 98765 00002',demo:true}]
    .forEach(d=>{if(!u.some(x=>x.email===d.email)){u.push(d);changed=true;}});
    if(changed)saveUsers(u);
  }
  function nameFromEmail(email){
    const local=String(email||'').split('@')[0].trim().replace(/[._]+/g,' ').replace(/\s+/g,' ').trim();
    return local.split(' ').filter(Boolean).map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join(' ')||'Guest';
  }
  function get(){
    const src=SS.getItem('hcs_isLoggedIn')==='true'?SS:(LS.getItem('hcs_isLoggedIn')==='true'?LS:null);
    if(!src)return null;
    const email=src.getItem('hcs_userEmail')||'',role=src.getItem('hcs_userRole')||'';
    if(!email||!role)return null;
    const rec=users().find(u=>u.email===email.toLowerCase());
    const name=(rec&&rec.name)||src.getItem('hcs_userName')||nameFromEmail(email);
    return {email,role,name,phone:(rec&&rec.phone)||''};
  }
  function save(user,remember){
    clear();
    const target=remember?LS:SS;
    safe(()=>{target.setItem('hcs_userRole',user.role);target.setItem('hcs_userEmail',user.email);target.setItem('hcs_userName',user.name||nameFromEmail(user.email));target.setItem('hcs_isLoggedIn','true');
      LS.setItem('hcs_rememberMe',remember?'true':'false');
      if(remember)LS.setItem('hcs_lastEmail',user.email);else LS.removeItem('hcs_lastEmail');});
  }
  function clear(){KEYS.forEach(k=>{safe(()=>LS.removeItem(k));safe(()=>SS.removeItem(k));});}
  function updateSessionName(name){[LS,SS].forEach(s=>safe(()=>{if(s.getItem('hcs_isLoggedIn')==='true')s.setItem('hcs_userName',name);}));}
  // Guard for dashboards: redirect when signed out or when the role does not match this page.
  function guard(requiredRole){
    const s=get();
    if(!s){location.replace('login.html');return null;}
    if(s.role!==requiredRole){location.replace(s.role==='admin'?'admin-dashboard.html':'customer-dashboard.html');return null;}
    return s;

function modal(title,html,onMount){

  bg.innerHTML='<div class="modal" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><button class="x" aria-label="Close"><i class="fa-solid fa-xmark"></i></button><h3>'+esc(title)+'</h3><div class="mb">'+html+'</div></div>';
  root.appendChild(bg);
  const close=()=>{bg.remove();document.removeEventListener('keydown',key);if(last&&last.focus)last.focus();};
  const key=e=>{if(e.key==='Escape')close();};document.addEventListener('keydown',key);
  bg.addEventListener('click',e=>{if(e.target===bg)close();});$('.x',bg).addEventListener('click',close);
  $$('[data-close]',bg).forEach(b=>b.addEventListener('click',close));

function mountShell(S,views,fallback,notes){
  const roleLabel=S.role==='admin'?'Admin':'Customer';
  $$('[data-bind="name"]').forEach(e=>e.textContent=S.name);
  $$('[data-bind="initials"]').forEach(e=>e.textContent=initials(S.name));

  $$('[data-bind="email"]').forEach(e=>e.textContent=S.email);
  $$('[data-bind="roleemail"]').forEach(e=>e.textContent=roleLabel+' · '+S.email);
  const side=$('#side'),scrim=$('#dscrim'),burger=$('#burgerD');
  const setSide=o=>{side.classList.toggle('open',o);scrim.classList.toggle('open',o);document.body.classList.toggle('no-scroll',o);burger.setAttribute('aria-expanded',String(o));if(o)$('#sideClose').focus();};
  burger.addEventListener('click',()=>setSide(true));$('#sideClose').addEventListener('click',()=>{setSide(false);burger.focus();});scrim.addEventListener('click',()=>setSide(false));
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(side.classList.contains('open'))setSide(false);closeBell();}});
  window.addEventListener('resize',()=>{if(innerWidth>1000&&side.classList.contains('open'))setSide(false);});
  const doLogout=()=>{HCS.logout();};$('#logoutSide').addEventListener('click',doLogout);$('#logoutTop').addEventListener('click',doLogout);
  // notifications (sample)
  const bell=$('#bellBtn'),pop=$('#bellPop');let unread=notes.length;
  $('#bellList').innerHTML=notes.map(n=>'<li class="unread"><i class="fa-solid '+n[0]+'"></i><span>'+esc(n[1])+'<small>'+esc(n[2])+'</small></span></li>').join('');
  $('#bellDot').textContent=unread;
  function closeBell(){pop.classList.remove('open');bell.setAttribute('aria-expanded','false');}
  bell.addEventListener('click',e=>{e.stopPropagation();const o=!pop.classList.contains('open');pop.classList.toggle('open',o);bell.setAttribute('aria-expanded',String(o));if(o){unread=0;$('#bellDot').style.display='none';}});
  document.addEventListener('click',e=>{if(!pop.contains(e.target))closeBell();});
  // routing
  const view=$('#view'),btns=$$('.nav-btn[data-view]');
  function go(id,fromUser){
    if(!views[id])id=fallback;const v=views[id];
    btns.forEach(b=>{const on=b.dataset.view===id;b.classList.toggle('active',on);if(on)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
    $('#pageTitle').textContent=v.title;$('#pageSub').textContent=typeof v.sub==='function'?v.sub():v.sub||'';document.title=v.title+' — Healthy Catering Services Portal';
    view.classList.remove('enter');void view.offsetWidth;view.innerHTML='';v.render(view);view.classList.add('enter');
    if(fromUser){history.replaceState(null,'','#'+id);setSide(false);window.scrollTo({top:0,behavior:'smooth'});}
  }
  btns.forEach(b=>b.addEventListener('click',()=>go(b.dataset.view,true)));
  window.addEventListener('hashchange',()=>go(location.hash.slice(1)));
  go(location.hash.slice(1)||fallback);
  document.body.classList.add('ready');
  return {go,refresh:()=>go(location.hash.slice(1)||fallback)};
}

  function draw(){

    $('#mTable',el).innerHTML=A.menu.length?'<table class="tbl"><thead><tr><th>Item</th><th>Category</th><th class="num">Price</th><th>Available</th><th></th></tr></thead><tbody>'+A.menu.map((m,i)=>'<tr><td data-label="Item"><b>'+esc(m.name)+'</b><br>'+m.diet.map(d=>'<span class="tag">'+d+'</span> ').join('')+'</td><td data-label="Category">'+m.cat+'</td><td data-label="Price" class="num">'+inr(m.price)+'</td><td data-label="Available"><button class="switch" role="switch" aria-checked="'+m.on+'" aria-label="Available: '+esc(m.name)+'" data-t="'+i+'"></button></td><td data-label="Actions"><button class="mini danger" data-del="'+i+'"><i class="fa-regular fa-trash-can"></i> Remove</button></td></tr>').join('')+'</tbody></table>':emptyState('fa-utensils','The menu is empty','Add your first item using the form.');
    $$('[data-t]',el).forEach(b=>b.addEventListener('click',()=>{const m=A.menu[+b.dataset.t];m.on=!m.on;persist();toast(m.name+(m.on?' is now available.':' is hidden from the menu.'),'info');draw();}));
    $$('[data-del]',el).forEach(b=>b.addEventListener('click',()=>{const m=A.menu.splice(+b.dataset.del,1)[0];persist();toast('Removed “'+m.name+'”.','info');draw();}));
  }
  $('#mCats',el).addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(!b)return;cat=b.dataset.c;$$('#mCats .pill',el).forEach(x=>{const on=x===b;x.setAttribute('aria-pressed',on);x.setAttribute('aria-checked',on);});$('#mCats',el).parentElement.classList.remove('invalid');});
  $('#mDiets',el).addEventListener('click',e=>{const b=e.target.closest('[data-d]');if(!b)return;const d=b.dataset.d;diets=diets.includes(d)?diets.filter(x=>x!==d):diets.concat(d);b.setAttribute('aria-pressed',diets.includes(d));});
  $('#addForm',el).addEventListener('submit',e=>{e.preventDefault();
    const n=$('#mName',el),p=$('#mPrice',el);let ok=true;const nv=n.value.trim();
    if(nv.length<3){fieldErr(n,'Enter an item name (at least 3 characters).');ok=false;}else if(A.menu.some(m=>m.name.toLowerCase()===nv.toLowerCase())){fieldErr(n,'An item with this name already exists.');ok=false;}else fieldErr(n,'');
    const pv=Number(p.value);if(!(pv>=1&&pv<=9999)){fieldErr(p,'Enter a price between ₹1 and ₹9,999.');ok=false;}else fieldErr(p,'');
    const cf=$('#mCats',el).parentElement;if(!cat){cf.classList.add('invalid');cf.querySelector('.err').textContent='Choose a category.';ok=false;}
    if(!ok){toast('Please fix the highlighted fields.','error');return;}
    A.menu.unshift({name:nv,cat,price:Math.round(pv),diet:diets.slice(),on:true});persist();toast('Added “'+nv+'” to the menu.','success');views.menu.render(el);
  });
  draw();
}};

/* ---------- Orders ---------- */
views.orders={title:'Orders',sub:'Track and update order status.',render(el){
  let f='All';
  el.innerHTML='<div class="card"><div class="toolbar"><div class="pills" id="oPills" role="group" aria-label="Filter orders by status">'+['All'].concat(STATUSES).map(s=>'<button class="pill" aria-pressed="'+(s===f)+'" data-s="'+s+'">'+s+'</button>').join('')+'</div>'+SAMPLE_BADGE+'</div><div class="tbl-wrap" id="oTable"></div></div>';
  function draw(){const list=f==='All'?A.orders:A.orders.filter(o=>o.status===f);$('#oTable',el).innerHTML=ordersTable(list);bindOrders(el,draw);}
  $('#oPills',el).addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(!b)return;f=b.dataset.s;$$('#oPills .pill',el).forEach(x=>x.setAttribute('aria-pressed',x===b));draw();});draw();
}};

/* ---------- Bookings ---------- */
views.bookings={title:'Catering Bookings',sub:'Review event requests and confirm or decline them.',render(el){
  function draw(){
    el.innerHTML='<div class="toolbar"><span>'+SAMPLE_BADGE+'</span></div>'+(A.book.length?'<div class="grid g3">'+A.book.map(b=>'<article class="card"><div class="card-head"><div><h2>'+esc(b.event)+'</h2><p class="sub" style="margin:0">'+esc(b.client)+'</p></div><span class="status '+stClass(b.status)+'">'+b.status+'</span></div>'+
      '<p style="margin:0 0 4px"><i class="fa-regular fa-calendar" style="color:var(--emerald);width:20px"></i> '+fmtDate(b.date)+'</p><p style="margin:0 0 4px"><i class="fa-solid fa-users" style="color:var(--emerald);width:20px"></i> '+b.guests+' guests</p><p style="margin:0 0 14px"><i class="fa-solid fa-location-dot" style="color:var(--emerald);width:20px"></i> '+esc(b.venue)+'</p>'+
      '<div class="pills"><button class="mini" data-v="'+b.id+'">View details</button>'+(b.status!=='Confirmed'?'<button class="mini ok" data-a="'+b.id+'|Confirmed">Confirm</button>':'')+(b.status!=='Declined'?'<button class="mini danger" data-a="'+b.id+'|Declined">Decline</button>':'')+'</div></article>').join('')+'</div>':emptyState('fa-calendar','No bookings yet','Catering requests will appear here.'));
    $$('[data-v]',el).forEach(x=>x.addEventListener('click',()=>{const b=A.book.find(y=>y.id==x.dataset.v);modal(b.event,'<dl class="kv"><dt>Client</dt><dd>'+esc(b.client)+'</dd><dt>Date</dt><dd>'+fmtDate(b.date)+'</dd><dt>Guests</dt><dd>'+b.guests+'</dd><dt>Venue</dt><dd>'+esc(b.venue)+'</dd><dt>Status</dt><dd><span class="status '+stClass(b.status)+'">'+b.status+'</span></dd><dt>Notes</dt><dd>'+esc(b.note)+'</dd></dl><p class="note-s">Sample booking for demonstration.</p><button class="btn sm" data-close>Close</button>');}));
    $$('[data-a]',el).forEach(x=>x.addEventListener('click',()=>{const [id,st]=x.dataset.a.split('|');const b=A.book.find(y=>y.id==id);b.status=st;persist();toast('“'+b.event+'” marked '+st.toLowerCase()+'.','success');draw();}));
  }
  draw();
}};

/* ---------- Customers ---------- */
views.customers={title:'Customers',sub:'Search customers, including accounts registered on this device.',render(el){
  const reg=HCS.users().filter(u=>u.role==='customer').map(u=>({name:u.name,email:u.email,plan:(load('hcs_customer_data',{})[u.email]||{}).plan||'None',orders:0,city:'—',registered:true}));
  const rows=reg.concat(DEF_CUST);
  el.innerHTML='<div class="card"><div class="toolbar"><div class="searchbox"><i class="fa-solid fa-magnifying-glass"></i><label class="sr" for="cq" style="position:absolute;left:-9999px">Search customers</label><input class="input" id="cq" type="search" placeholder="Search by name, email or plan" autocomplete="off"></div><span class="hint" id="cCount"></span></div><div class="tbl-wrap" id="cTable"></div></div>';
  const draw=()=>{const q=$('#cq',el).value.trim().toLowerCase(),list=rows.filter(r=>!q||(r.name+r.email+r.plan).toLowerCase().includes(q));
    $('#cCount',el).textContent=list.length+' of '+rows.length+' customers';
    $('#cTable',el).innerHTML=list.length?'<table class="tbl"><thead><tr><th>Customer</th><th>Plan</th><th class="num">Orders</th><th>Source</th><th></th></tr></thead><tbody>'+list.map((r,i)=>'<tr><td data-label="Customer"><b>'+esc(r.name)+'</b><br><small style="color:var(--muted)">'+esc(r.email)+'</small></td><td data-label="Plan">'+esc(r.plan)+'</td><td data-label="Orders" class="num">'+r.orders+'</td><td data-label="Source"><span class="tag'+(r.registered?'':' citrus')+'">'+(r.registered?'Registered here':'Sample')+'</span></td><td data-label=""><button class="mini" data-c="'+rows.indexOf(r)+'">View</button></td></tr>').join('')+'</tbody></table>':emptyState('fa-user-slash','No customers found','Try a different name, email or plan.');
    $$('[data-c]',el).forEach(b=>b.addEventListener('click',()=>{const r=rows[+b.dataset.c];modal(r.name,'<dl class="kv"><dt>Email</dt><dd>'+esc(r.email)+'</dd><dt>Plan</dt><dd>'+esc(r.plan)+'</dd><dt>Orders</dt><dd>'+r.orders+'</dd><dt>City</dt><dd>'+esc(r.city)+'</dd></dl><button class="btn sm" data-close>Close</button>');}));};
  $('#cq',el).addEventListener('input',draw);draw();
}};

/* ---------- Meal plans ---------- */
views.plans={title:'Meal Plans',sub:'Manage plan availability and sample weekly pricing.',render(el){
  el.innerHTML='<div class="grid g3">'+A.plans.map((p,i)=>'<article class="card plan-card"><div class="card-head"><div><h3 class="t">'+esc(p.name)+'</h3><p class="sub" style="margin:0">'+esc(p.desc)+'</p></div><button class="switch" role="switch" aria-checked="'+p.on+'" aria-label="Plan active: '+esc(p.name)+'" data-t="'+i+'"></button></div>'+
   '<p style="margin:0 0 10px"><span class="status '+(p.on?'st-Active':'st-Declined')+'">'+(p.on?'Active':'Paused')+'</span> <span class="samp" style="margin-left:6px">'+p.subs+' subscribers (sample)</span></p>'+
   '<div class="field"><label for="pp'+i+'">Weekly price (₹)</label><input class="input" id="pp'+i+'" type="number" min="1" value="'+p.price+'" inputmode="numeric"></div><button class="btn sm" data-s="'+i+'">Save price</button></article>').join('')+'</div><p class="note-s">Changes are saved in this browser only. A real site needs a backend to update public pricing.</p>';
  $$('[data-t]',el).forEach(b=>b.addEventListener('click',()=>{const p=A.plans[+b.dataset.t];p.on=!p.on;persist();toast(p.name+(p.on?' is active.':' is paused.'),'info');views.plans.render(el);}));
  $$('[data-s]',el).forEach(b=>b.addEventListener('click',()=>{const i=+b.dataset.s,inp=$('#pp'+i,el),v=Number(inp.value);if(!(v>=1&&v<=99999)){fieldErr(inp,'Enter a valid price.');return;}fieldErr(inp,'');A.plans[i].price=Math.round(v);persist();toast(A.plans[i].name+' price saved: '+inr(v)+'.','success');}));
}};

/* ---------- Messages ---------- */
views.messages={title:'Messages',sub:'Customer inquiries, including Contact page submissions on this device.',render(el){
  let sel=null;
  function draw(){
    const msgs=allMessages();updateBadge();
    if(!msgs.length){el.innerHTML=emptyState('fa-inbox','Your inbox is empty','New customer inquiries will appear here.');return;}
    el.innerHTML='<div class="msgs"><div class="thread" role="list" aria-label="Inbox">'+msgs.map(m=>'<button role="listitem" data-m="'+m.id+'" class="'+(sel===m.id?'sel':'')+'"><b><span>'+esc(m.name)+'</span>'+(m.unread?'<span class="un" aria-label="Unread"></span>':'')+'</b><span class="pv">'+esc(m.subject)+'</span></button>').join('')+'</div><div class="card" id="detail">'+emptyState('fa-envelope-open','Select a message','Choose a conversation to read and reply.')+'</div></div>';
    $$('[data-m]',el).forEach(b=>b.addEventListener('click',()=>{sel=b.dataset.m;A.msgState[sel]=Object.assign(A.msgState[sel]||{},{read:true});persist();draw();show();}));
    if(sel)show();
  }
  function show(){
    const m=allMessages().find(x=>x.id===sel);if(!m)return;
    $('#detail',el).innerHTML='<h2>'+esc(m.subject)+'</h2><p class="sub">From '+esc(m.name)+' · '+esc(m.email)+(m.phone?' · '+esc(m.phone):'')+' · '+fmtDate(m.date)+(m.sample?' · <span class="samp">Sample</span>':'')+(m.type?' · '+esc(m.type):'')+'</p>'+
    '<div class="bubble">'+esc(m.message)+'</div>'+m.replies.map(r=>'<div class="bubble me">'+esc(r.text)+'<small>You · '+fmtDate(r.date)+'</small></div>').join('')+
    '<form id="reply" novalidate><div class="field" style="margin-top:12px"><label for="rt">Reply (demo — not emailed)</label><textarea class="input" id="rt" style="min-height:100px" placeholder="Write a reply…"></textarea></div><button class="btn sm" type="submit"><i class="fa-solid fa-paper-plane"></i> Save reply</button></form>';
    $('#reply',el).addEventListener('submit',e=>{e.preventDefault();const t=$('#rt',el);if(t.value.trim().length<2){fieldErr(t,'Write a reply first.');return;}
      const st=A.msgState[sel]=A.msgState[sel]||{};st.read=true;st.replies=(st.replies||[]).concat({text:t.value.trim(),date:new Date().toISOString()});persist();toast('Reply saved locally. No email was sent in this demo.','success');draw();});
    $$('[data-m]',el).forEach(b=>b.classList.toggle('sel',b.dataset.m===sel));
  }
  draw();
}};

/* ---------- Reports ---------- */
views.reports={title:'Reports',sub:'Sample sales trends and a CSV export of the order list.',render(el){
  const months=['May','Jun','Jul','Aug','Sep','Oct'],rev=[3.1,3.6,3.9,4.2,4.6,4.8],mx=Math.max(...rev);
  const split=[['Lunch boxes',38,'#27845C'],['Catering events',29,'#183D32'],['Meal plans',22,'#E87555'],['Snacks',11,'#EBCB72']];
  let acc=0;const grad=split.map(s=>{const a=acc;acc+=s[1];return s[2]+' '+a+'% '+acc+'%';}).join(',');
  el.innerHTML='<div class="toolbar"><span>'+SAMPLE_BADGE+'</span><button class="btn sm" id="csv"><i class="fa-solid fa-file-arrow-down"></i> Export orders (CSV)</button></div><div class="grid g21"><div class="card"><h2>Monthly revenue (₹ lakh)</h2><p class="sub">Sample six-month trend</p><div class="bars" role="img" aria-label="Monthly revenue bar chart">'+rev.map((v,i)=>'<div class="bar-col'+(v===mx?' hi':'')+'"><div class="bar" tabindex="0" data-h="'+Math.round(v/mx*100)+'" data-v="₹'+v+'L" aria-label="'+months[i]+': ₹'+v+' lakh"></div></div>').join('')+'</div><div class="bar-labels">'+months.map(m=>'<span>'+m+'</span>').join('')+'</div></div>'+
  '<div class="card"><h2>Revenue by category</h2><p class="sub">Share of sample revenue</p><div class="donut" style="background:conic-gradient('+grad+')" role="img" aria-label="Donut chart of revenue by category"></div><div class="legend">'+split.map(s=>'<span><i style="background:'+s[2]+'"></i>'+s[0]+' '+s[1]+'%</span>').join('')+'</div></div></div>';
  requestAnimationFrame(()=>$$('.bar',el).forEach(b=>b.style.height=b.dataset.h+'%'));
  $('#csv',el).addEventListener('click',()=>{
    const rows=[['Order','Customer','Items','Total (INR)','Status','Date']].concat(A.orders.map(o=>[o.id,o.customer,o.items,o.total,o.status,o.date]));
    const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='sample-orders.csv';document.body.appendChild(a);a.click();a.remove();toast('Sample orders exported as CSV.','success');
  });
}};
